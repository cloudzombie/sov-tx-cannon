[package]
name = "sov-tx-cannon"
version = "0.2.1"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Automated transaction traffic generator for SOV: watches the chain tip and fires signed transfers each new block, from a SOV-Station wallet the user unlocks."

# Standalone repository — this crate is NOT a member of the SOV chain workspace and
# never modifies it. It depends on the real chain crates as GIT dependencies pinned to
# a released SOV tag (the same keystore decryption, signing, ids, and RPC client
# SOV-Station uses — no reimplemented crypto anywhere in this crate).
[[bin]]
name = "sov-tx-cannon"
path = "src/main.rs"

[dependencies]
# --- SOV chain crates (pinned) ------------------------------------------------
# Pinned BY TAG, never by branch: the signing, id, and codec rules this tool uses
# must be a released, reviewed consensus surface, not whatever `main` happens to be.
# Bumping SOV_CHAIN_TAG is a deliberate, reviewed change — see README.md
# ("Chain dependency pin"). Keep all four on the SAME tag.
sov-rpc = { git = "https://github.com/cloudzombie/sov", tag = "v0.2.0" }
sov-crypto = { git = "https://github.com/cloudzombie/sov", tag = "v0.2.0" }
sov-types = { git = "https://github.com/cloudzombie/sov", tag = "v0.2.0" }
sov-primitives = { git = "https://github.com/cloudzombie/sov", tag = "v0.2.0" }
# ------------------------------------------------------------------------------
# Native GUI — the same immediate-mode stack as SOV-Station.
eframe = "0.29"
# Memory hygiene: passphrase and signing seeds wiped on drop.
zeroize = "1"
# OS entropy for the random destination / random amount modes.
getrandom = "0.2"
# Decoding the keystore's hex seed fields (matches the workspace's hex version).
hex = "0.4"
# JSON — already in the tree via sov-rpc; used for the fee-auction deployment gate
# and to express the adversarial raw-payload attacks (malformed protocol) exactly as
# the reference live probe does. No new heavy dependency: it is a transitive dep made
# direct.
serde_json = "1"

[dev-dependencies]
# The unit tests assert a built+signed tx round-trips through the same Borsh
# codec the chain uses; pinned to the workspace's version via the types crate.
borsh = "1"

[lints.rust]
unsafe_code = "forbid"
